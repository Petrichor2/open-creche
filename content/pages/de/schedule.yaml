title: "Unser harmonischer Tagesablauf"
description: "Ein verlässlicher, ruhiger Tagesrhythmus gibt den Kindern Geborgenheit und lässt gleichzeitig viel Raum für freies Spiel."
items:
  - time: "07:00 – 08:15"
    title: "Ankommen & Freies Morgenspiel"
    description: "Herzlicher Empfang der Kinder, ruhiges Einzel- und Kleingruppenspiel im Gruppenraum."
    category: "play"
  - time: "08:15 – 08:45"
    title: "Gemeinsames Frühstück"
    description: "Händewaschen und anschließendes gemütliches Frühstück mit frischem Gebäck und Gemüse."
    category: "meal"
  - time: "08:45 – 10:00"
    title: "Morgenkreis, Reime & Kreatives Gestalten"
    description: "Gemeinsames Singen, Fingerspiele, Malen, Basteln und spielerisches Entdecken."
    category: "activity"
  - time: "10:00 – 11:45"
    title: "Obstpause & Spiel im Garten"
    description: "Frisches Obst der Saison, danach Bewegung, Sandkasten und Naturerkundung im schattigen Hof."
    category: "outdoor"
  - time: "11:45 – 12:30"
    title: "Warmes Mittagessen"
    description: "Nahrhaftes zweigängiges Mittagessen in der Gruppe mit liebevoller Förderung der Selbstständigkeit."
    category: "meal"
  - time: "12:30 – 15:00"
    title: "Märchenstunde & Mittagsruhe"
    description: "Zur Ruhe kommen bei erzählten Märchen und Schlafliedern, gefolgt vom erholsamen Mittagsschlaf."
    category: "rest"
  - time: "15:00 – 17:00"
    title: "Jause & Nachmittagsspiel bis zur Abholung"
    description: "Stärkung nach dem Aufwachen, danach freies Spiel im Raum oder im Garten bis die Eltern kommen."
    category: "play"
