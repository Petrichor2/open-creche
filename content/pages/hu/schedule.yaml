title: "Harmonikus Napirendünk"
description: "A kiszámítható, nyugodt napi ritmus biztonságérzetet ad a gyermekeknek, miközben bőséges teret hagy a szabad játéknak."
items:
  - time: "07:00 – 08:15"
    title: "Érkezés és reggeli szabad játék"
    description: "Gyermekek szeretetteljes fogadása, elmélyült egyéni és kiscsoportos játék a csoportszobában."
    category: "play"
  - time: "08:15 – 08:45"
    title: "Közös reggeli"
    description: "Kézmosás, majd nyugodt, családias reggelizés friss pékáruval és zöldségekkel."
    category: "meal"
  - time: "08:45 – 10:00"
    title: "Mesekör, mondókázás és alkotás"
    description: "Éneklés, ölbeli játékok, kézműveskedés, festés és játékos tapasztalatszerzés."
    category: "activity"
  - time: "10:00 – 11:45"
    title: "Gyümölcstízórai és kerti játék"
    description: "Friss idénygyümölcs fogyasztása, majd mozgás, homokozás és felfedezés az árnyékos udvaron."
    category: "outdoor"
  - time: "11:45 – 12:30"
    title: "Meleg ebéd"
    description: "Kétfogásos, tápláló ebéd közös elfogyasztása, az önállóság támogatásával."
    category: "meal"
  - time: "12:30 – 15:00"
    title: "Elcsendesedés, élőszavas mese és pihenés"
    description: "Bújócskázás a takaró alá, élőszavas népmese, majd nyugodt délutáni alvás."
    category: "rest"
  - time: "15:00 – 17:00"
    title: "Uzsonna és délutáni játék hazamenetelig"
    description: "Ébredés utáni uzsonna, majd szabad játék a szobában vagy a kertben a szülők érkezéséig."
    category: "play"
