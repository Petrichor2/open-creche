  title: "Datenschutzinformationen"
  controllerIntro: "Datenschutzverantwortlicher:"
  storageTitle: "Was speichert Ihr Browser?"
  storageItems:
    - "Darstellungseinstellung (helles / dunkles / kontrastreiches Design) — nur wenn Sie den Design-Umschalter verwenden. Über die Website-Daten Ihres Browsers entfernbar."
    - "Der Schlüssel der Missbrauchs-Verifikation — erst nachdem Sie geschützte Inhalte freischalten; beim Schließen des Tabs wird er gelöscht."
    - "Das Wegklicken des Demo-Hinweises — erst nach dem Drücken von OK; beim Schließen des Tabs wird er gelöscht."
  noTracking: "Diese Website verwendet keine Tracking-Cookies, Werbe-IDs oder Analyse-Lösungen und setzt keine sonstigen Cookies."
