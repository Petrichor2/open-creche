  formDataBody: "Name, E-Mail-Adresse, Telefonnummer und Nachricht werden ausschließlich zur Beantwortung Ihrer Anfrage verwendet. Die Daten erreichen uns über den Cloudflare Worker, die Zustellung erfolgt über Resend. Ein Drittanbieter (Bot-Schutz: Cloudflare Turnstile) wird erst einbezogen, wenn Sie das Formular nutzen."
  rightsTitle: "Ihre Rechte (DSGVO)"
  rightsBody: "Nach der DSGVO können Sie Auskunft über Ihre gespeicherten Daten sowie deren Berichtigung oder Löschung verlangen. Unsere Kontaktdaten finden Sie im Abschnitt Kontakt (nach der menschlichen Verifikation sichtbar)."

