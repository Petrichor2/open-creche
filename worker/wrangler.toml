name = "open-creche-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[vars]
# Site origin allowed to call this Worker's APIs (CORS). Keep in sync with site.url.
ALLOWED_ORIGIN = "https://ovi.danielfekete.com"
FROM_EMAIL = "***REMOVED***"

# Secrets to be configured via `npx wrangler secret put <NAME>`:
# - VAULT_MASTER_KEY
# - TURNSTILE_SECRET_KEY
# - RESEND_API_KEY
# - CONTACT_RECIPIENT_EMAIL
# - GITHUB_OAUTH_CLIENT_ID
# - GITHUB_OAUTH_CLIENT_SECRET
