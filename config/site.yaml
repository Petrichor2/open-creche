# Global Site Configuration for OpenCreche
site:
  # Canonical site URL. The deployment base path is derived from this URL's pathname:
  #   - "https://<user>.github.io/<repo>" -> site is served under "/<repo>/" (GitHub Pages project site)
  #   - "https://www.my-creche.hu"         -> site is served at the domain root ("/")
  # Update this URL when you attach a custom domain and all links adjust automatically.
  url: "https://ovi.danielfekete.com"
  # Demo content: shows the dismissible "This is a demo website" notice.
  # Independent of security.demoMode — keep it true while the institution data
  # (names, address, photos) is still illustrative sample data, even when the
  # Privacy Vault already runs on a real Cloudflare Worker + Turnstile.
  demoContent: true
  type: "combined" # "creche" | "kindergarten" | "combined"

  title:
    hu: "Napsugár Bölcsőde és Óvoda"
    en: "Sunshine Creche & Kindergarten"
    de: "Sonnenschein Kinderkrippe & Kindergarten"

  tagline:
    hu: "Szeretetteljes, biztonságos és természetközeli fészek a legkisebbeknek"
    en: "A loving, safe, and nature-close nest for the little ones"
    de: "Ein liebevolles, sicheres und naturnahes Nest für die Kleinsten"

  heroSubtitle:
    hu: "1,5 éves kortól 6 éves korig várjuk a gyermekeket kis létszámú, családias csoportjainkba, saját árnyékos kerttel és gondoskodó pedagógusokkal."
    en: "We welcome children aged 1.5 to 6 into our small, family-like groups with a shaded private garden and caring educators."
    de: "Wir heißen Kinder im Alter von 1,5 bis 6 Jahren in unseren kleinen, familiären Gruppen mit eigenem schattigen Garten und liebevollen Pädagogen willkommen."

  location:
    country: "Magyarország"
    # NOTE: These are clearly fictitious DEMO values (nonexistent postal code "0000",
    # a placeholder city and street, and null-island coordinates). Replace them with
    # your institution's real address when deploying.
    postalCode: "0000"
    city: "Példaváros"
    address:
      hu: "Példa utca 42."
      en: "42 Example Street"
      de: "Beispielstraße 42"
    coordinates:
      lat: 0
      lng: 0
    openingHours:
      hu: "Hétfő – Péntek: 07:00 – 17:00"
      en: "Monday – Friday: 07:00 – 17:00"
      de: "Montag – Freitag: 07:00 – 17:00"

i18n:
  defaultLocale: "hu"
  locales:
    - code: "hu"
      label: "Magyar"
      flag: "🇭🇺"
    - code: "en"
      label: "English"
      flag: "🇬🇧"
    - code: "de"
      label: "Deutsch"
      flag: "🇩🇪"
  fallbackToDefault: true
  autoTranslate:
    enabled: true
    # Primary provider: "gemini" (free tier, GEMINI_API_KEY secret required)
    # Fallback provider: "cloudflare-ai" (CF_ACCOUNT_ID + CF_AI_TOKEN secrets)
    # NOTE: "github-models" was retired by GitHub on July 30, 2026 and is no longer available.
    provider: "gemini"
    model: "gemini-2.5-flash"
    tone: "Warm, welcoming, natural early-childhood education terminology"
    collections:
      - "pages"
      - "groups"
      - "news"
      - "i18n"

theme:
  # Options: "sunshine" | "meadow" | "terracotta" | "forest"
  palette: "sunshine"
  colors:
    background: "#FAF6F0"
    surface: "#F3ECE1"
    surfaceElevated: "#FFFFFF"
    primary: "#D96B43"
    primaryDark: "#B8522E"
    secondary: "#5B8266"
    accent: "#E6B84C"
    text: "#2C2523"
    textMuted: "#685B56"
  dividerStyle: "hills"

features:
  about: true
  dailySchedule: true
  groups: true
  newsAndEvents: true
  staffDirectory: true
  photoGallery: true
  contactForm: true

security:
  # Cloudflare Turnstile Site Key (public, safe to commit)
  turnstileSiteKey: "0x4AAAAAAGLrs-L21MhVMeu3"
  # Cloudflare Worker base URL (Turnstile verification, vault key release, contact form relay)
  workerBaseUrl: "https://open-creche-worker.fekete-dani1994.workers.dev"
  # Production mode: the AES key is only released by the Worker after a valid Turnstile check.
  demoMode: false
  protect:
    contactDetails: true
    staffProfiles: true
    galleryPhotos: true
    contactForm: true
