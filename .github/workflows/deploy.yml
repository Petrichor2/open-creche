name: Auto-Translate, Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Free AI Auto-Translation (Gemini + Cloudflare fallback)
        # Non-fatal: translations are optional; the build proceeds even if no AI provider is configured.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
        run: bun run i18n:translate

      - name: Commit and push auto-translated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          if ! git diff --cached --quiet; then
            git commit -m "chore(i18n): auto-translate content updates [skip ci]"
            git push origin HEAD:main
          else
            echo "No new translations needed."
          fi

      - name: Ensure encrypted Privacy Vault exists
        run: |
          if [ ! -f "public/vault/contact.enc.json" ]; then
            bun run vault:demo
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build static Astro site
        run: bun run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
